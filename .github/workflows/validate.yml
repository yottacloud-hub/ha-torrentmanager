name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La version du manifeste est documentée dans CHANGELOG.md
        run: |
          V=$(python3 -c "import json;print(json.load(open('custom_components/c411/manifest.json'))['version'])")
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error::Ajoutez une section ## [$V] dans CHANGELOG.md"; exit 1; }

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics description license

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - name: Paquet frontend de Home Assistant (requis par le panneau)
        run: |
          V=$(python -c "import json, homeassistant.components.frontend as f, pathlib; print([r for r in json.load(open(pathlib.Path(f.__file__).parent/'manifest.json'))['requirements'] if r.startswith('home-assistant-frontend')][0])")
          pip install "$V"
      - run: pytest -q
